<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="perhap-server" content="ws://localhost:4223">
  <title>Perhap — Shopping Cart Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f0;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 2rem;
    }

    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 2rem; letter-spacing: -0.02em; }

    .layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 2rem;
      max-width: 900px;
    }

    /* Product catalog */
    .products { display: flex; flex-direction: column; gap: 1rem; }

    .product {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .product-info { flex: 1; }
    .product-name { font-weight: 500; }
    .product-price { font-size: 0.9rem; color: #666; margin-top: 2px; }

    /* Cart */
    .cart-panel {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 1.5rem;
      align-self: start;
      position: sticky;
      top: 2rem;
    }

    .cart-panel h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1.25rem; }

    .cart-items { display: flex; flex-direction: column; gap: 0.75rem; min-height: 80px; }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-size: 0.9rem;
    }
    .cart-item-name { flex: 1; }
    .cart-item-right { text-align: right; white-space: nowrap; margin-left: 1rem; }
    .cart-item-qty { color: #888; font-size: 0.8rem; }

    .cart-empty { color: #aaa; font-size: 0.9rem; font-style: italic; }

    .cart-divider { border: none; border-top: 1px solid #e5e5e5; margin: 1rem 0; }

    .cart-line { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 0.4rem; }
    .cart-line.total { font-weight: 600; font-size: 1rem; margin-top: 0.25rem; }

    /* Buttons */
    button {
      border: none;
      border-radius: 6px;
      padding: 0.45rem 1rem;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-add    { background: #1a1a1a; color: white; }
    .btn-add:hover { background: #333; }
    .btn-remove { background: #f0f0f0; color: #555; padding: 0.3rem 0.7rem; font-size: 0.8rem; }
    .btn-remove:hover { background: #e0e0e0; }

    /* Qty controls */
    .qty-control { display: flex; align-items: center; gap: 0.5rem; }
    .qty-control input {
      width: 48px;
      text-align: center;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 0.3rem;
      font-size: 0.85rem;
    }

    /* Pending / valid state */
    [data-watch][data-pending="true"] { opacity: 0.65; pointer-events: none; }
    [data-watch][data-valid="false"] .cart-items { outline: 2px solid #e53e3e; border-radius: 4px; }

    .status-bar {
      font-size: 0.75rem;
      color: #aaa;
      margin-top: 0.75rem;
      min-height: 1em;
    }
    [data-watch][data-pending="true"] ~ .status-bar::before { content: 'Updating…'; color: #f6ad55; }
    [data-watch][data-valid="false"]  ~ .status-bar::before { content: 'Invalid state'; color: #e53e3e; }
  </style>
</head>
<body>
  <h1>Perhap Demo — Shopping Cart</h1>

  <!--
    CART_ENTITY_ID is set by the inline script below.
    In a real app, the entity ID comes from the user's session.
  -->

  <div class="layout">

    <!-- Product catalog: add-to-cart buttons send events to the cart entity -->
    <div class="products" id="catalog">

      <div class="product">
        <div class="product-info">
          <div class="product-name">Organic Whole Coffee Beans</div>
          <div class="product-price">$18.99 / 12oz bag</div>
        </div>
        <button class="btn-add"
          data-tell="item_added"
          data-tell-target-ref="cart"
          data-tell-data='{"product_id":"coffee-001","name":"Organic Whole Coffee Beans","price":18.99,"quantity":1}'>
          Add to cart
        </button>
      </div>

      <div class="product">
        <div class="product-info">
          <div class="product-name">Raw Wildflower Honey</div>
          <div class="product-price">$12.49 / 16oz jar</div>
        </div>
        <button class="btn-add"
          data-tell="item_added"
          data-tell-target-ref="cart"
          data-tell-data='{"product_id":"honey-002","name":"Raw Wildflower Honey","price":12.49,"quantity":1}'>
          Add to cart
        </button>
      </div>

      <div class="product">
        <div class="product-info">
          <div class="product-name">Dark Chocolate Bar, 72%</div>
          <div class="product-price">$5.99 each</div>
        </div>
        <button class="btn-add"
          data-tell="item_added"
          data-tell-target-ref="cart"
          data-tell-data='{"product_id":"choc-003","name":"Dark Chocolate Bar, 72%","price":5.99,"quantity":1}'>
          Add to cart
        </button>
      </div>

      <div class="product">
        <div class="product-info">
          <div class="product-name">Himalayan Pink Salt</div>
          <div class="product-price">$8.49 / 1lb bag</div>
        </div>
        <button class="btn-add"
          data-tell="item_added"
          data-tell-target-ref="cart"
          data-tell-data='{"product_id":"salt-004","name":"Himalayan Pink Salt","price":8.49,"quantity":1}'>
          Add to cart
        </button>
      </div>

    </div><!-- /.products -->

    <!-- Cart panel: data-watch subscribes to the cart entity -->
    <div id="cart-container">
      <!-- Populated by JS once we know the entity ID -->
    </div>

  </div><!-- /.layout -->

  <script type="module" src="perhap.js"></script>
  <script type="module">
    import { watch, tell, ready } from './perhap.js'

    // In a real app this ID comes from the user's session.
    // For the demo we generate one per browser session and persist it.
    const CART_ENTITY_ID = (() => {
      const key = 'perhap-demo-cart-id'
      let id = sessionStorage.getItem(key)
      if (!id) {
        id = crypto.randomUUID()
        sessionStorage.setItem(key, id)
      }
      return id
    })()

    // Frontend reducer — mirrors the Go cart reducer for optimistic updates.
    function cartReducer(model, eventType, data) {
      const items = Object.fromEntries(
        Object.entries(model.items ?? {}).map(([k, v]) => [k, { ...v }])
      )
      if (eventType === 'item_added') {
        if (items[data.product_id]) {
          items[data.product_id].quantity += data.quantity
        } else {
          items[data.product_id] = {
            product_id: data.product_id, name: data.name,
            price: data.price, quantity: data.quantity
          }
        }
        items[data.product_id].line_total =
          items[data.product_id].price * items[data.product_id].quantity
      } else if (eventType === 'item_removed') {
        delete items[data.product_id]
      } else if (eventType === 'quantity_changed') {
        if (items[data.product_id]) {
          items[data.product_id].quantity = data.quantity
          items[data.product_id].line_total =
            items[data.product_id].price * data.quantity
        }
      }
      const subtotal = Object.values(items).reduce((s, i) => s + i.line_total, 0)
      const tax = Math.round(subtotal * 8.875) / 100
      return { ...model, items, subtotal: Math.round(subtotal * 100) / 100,
               tax, total: Math.round((subtotal + tax) * 100) / 100 }
    }

    // Build the cart panel HTML, wiring the entity ID in.
    const container = document.getElementById('cart-container')
    container.innerHTML = `
      <div id="cart">
        <div class="cart-panel">
          <h2>Your Cart</h2>
          <div class="cart-items" id="cart-items">
            <span class="cart-empty">Your cart is empty.</span>
          </div>
          <hr class="cart-divider">
          <div class="cart-line"><span>Subtotal</span><span>$<span id="cart-subtotal">0.00</span></span></div>
          <div class="cart-line"><span>Tax (8.875%)</span><span>$<span id="cart-tax">0.00</span></span></div>
          <div class="cart-line total"><span>Total</span><span>$<span id="cart-total">0.00</span></span></div>
        </div>
      </div>
    `

    function renderCart(reduction) {
      const items = reduction?.items ?? {}
      const keys = Object.keys(items)
      const itemsEl = document.getElementById('cart-items')

      if (keys.length === 0) {
        itemsEl.innerHTML = '<span class="cart-empty">Your cart is empty.</span>'
      } else {
        itemsEl.innerHTML = keys.map(id => {
          const item = items[id]
          return `
            <div class="cart-item">
              <div class="cart-item-name">${item.name}</div>
              <div class="cart-item-right">
                <div>$${(item.line_total ?? 0).toFixed(2)}</div>
                <div class="cart-item-qty">
                  qty ${item.quantity}
                  <button class="btn-remove"
                    data-tell="item_removed"
                    data-tell-target="store/${CART_ENTITY_ID}"
                    data-tell-data='{"product_id":"${id}"}'>×</button>
                </div>
              </div>
            </div>
          `
        }).join('')
        // data-tell wiring handled by SDK's MutationObserver
      }

      document.getElementById('cart-subtotal').textContent = (reduction?.subtotal ?? 0).toFixed(2)
      document.getElementById('cart-tax').textContent      = (reduction?.tax      ?? 0).toFixed(2)
      document.getElementById('cart-total').textContent    = (reduction?.total    ?? 0).toFixed(2)
    }

    // Wait for the NATS connection before subscribing and wiring buttons.
    // configure() is async; calling watch() before nc is set silently no-ops.
    ready.then(() => {
      // Subscribe to the cart entity with the frontend reducer for optimistic updates.
      watch('store', CART_ENTITY_ID, (state) => renderCart(state.reduction), cartReducer)

      // Wire add-to-cart buttons to the correct entity ID.
      document.querySelectorAll('[data-tell-target-ref="cart"]').forEach(btn => {
        btn.setAttribute('data-tell-target', `store/${CART_ENTITY_ID}`)
        btn.removeAttribute('data-tell-target-ref')
      })
    })
  </script>
</body>
</html>
